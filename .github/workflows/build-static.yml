name: Build static catalog

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build static site
        run: pnpm build:static

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: andrea-modpost-static
          path: apps/web/dist
